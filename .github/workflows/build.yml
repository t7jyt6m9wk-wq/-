name: Build roothide Tweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          # 1. 下载基础 Theos (不拉取多余的子模块，速度极快)
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          
          # 2. 下载官方 iOS SDK
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/
          mkdir -p $HOME/theos/sdks
          mv /tmp/sdks-master/iPhoneOS15.6.sdk $HOME/theos/sdks/ || mv /tmp/sdks-master/iPhoneOS15.5.sdk $HOME/theos/sdks/
          
          # 3. 下载 roothide 专用的打包补丁
          git clone --depth 1 https://github.com/roothide/theos.git /tmp/roothide
          cp -r /tmp/roothide/* $HOME/theos/

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: LockscreenQuickActions-deb
          path: packages/*.deb
