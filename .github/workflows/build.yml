name: Build roothide Tweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          curl -L https://github.com/theos/sdks/archive/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d $HOME/theos/sdks
          mv $HOME/theos/sdks/sdks-master/iPhoneOS15.5.sdk $HOME/theos/sdks/

      - name: Install roothide Patcher
        run: |
          git clone https://github.com/roothide/theos.git /tmp/roothide-theos
          cp -r /tmp/roothide-theos/* $HOME/theos/

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: LockscreenQuickActions-deb
          path: packages/*.deb
